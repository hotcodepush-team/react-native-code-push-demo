# The release that mounts nothing: its entry file registers no root, so React
# Native starts no surface and no first render signals readiness. The bundle
# ends the process, on iOS because the release build aborts on start, and the
# SDK rolls the app back on the next start: CRASHED, the reason seen on iOS
# and Android. A rollback at the gate, READY_TIMEOUT, is the accepted
# alternative. In both the rolledBack notice reaches the app, on the reload or
# on the next start.
# Continues from the release the runner left the app on; the runner releases
# the build and passes its number and label. By hand, release a build whose
# index.js holds `export {};` alone and run
# `maestro test -e BROKEN_RELEASE_NUMBER=8 -e BROKEN_VERSION=v9 -e EXPECTED_RELEASE_NUMBER=7 -e EXPECTED_VERSION=v8 maestro/rollback-without-root.yaml`.
# No `env:` header: Maestro defines it after the `-e` parameters, so its
# values would override them.
appId: com.hotcodepush.demo.reactnative
---
- launchApp
- assertVisible: '#${EXPECTED_RELEASE_NUMBER} · ${EXPECTED_VERSION}'
- tapOn: 'Sync now'
- extendedWaitUntil:
    notVisible: 'syncing…'
    timeout: 60000
- repeat:
    times: 3
    while:
      visible: 'FAILED · OFFLINE.*'
    commands:
      - tapOn: 'Sync now'
      - extendedWaitUntil:
          notVisible: 'syncing…'
          timeout: 60000
- assertVisible: '(UPDATED|UP_TO_DATE).*'
- stopApp
- launchApp
# On iOS Maestro fails the flow when a screen read meets the end of the
# process, so the flow lets the broken start end before it reads the screen
# again, waiting without touching the device: the abort comes about a second
# after the start, and ten seconds leave room for a slower simulator.
- evalScript: ${const until = Date.now() + 10000; while (Date.now() < until);}
# A launch without a stop starts the app again when the bundle or the
# rollback's reload ended the process, and leaves a running one alone: a stop
# would end an app that is up, and its next start rightly announces nothing.
- repeat:
    times: 3
    while:
      notVisible: 'from #${BROKEN_RELEASE_NUMBER} · ${BROKEN_VERSION} · (READY_TIMEOUT|CRASHED)'
    commands:
      - extendedWaitUntil:
          visible: 'from #${BROKEN_RELEASE_NUMBER} · ${BROKEN_VERSION} · (READY_TIMEOUT|CRASHED)'
          timeout: 30000
          optional: true
      - launchApp:
          stopApp: false
- assertVisible: 'from #${BROKEN_RELEASE_NUMBER} · ${BROKEN_VERSION} · (READY_TIMEOUT|CRASHED)'
- assertVisible: '#${EXPECTED_RELEASE_NUMBER} · ${EXPECTED_VERSION}'
# The failed bundle is blocklisted on this device: the next check skips it.
- tapOn: 'Sync now'
- extendedWaitUntil:
    notVisible: 'syncing…'
    timeout: 60000
- assertVisible: 'SKIPPED · FAILED_BEFORE'
