# The debug build embeds no bundle and loads its JavaScript from Metro.
# A sync therefore skips with `build_debug`.
# By hand, run `npm start`, then `npx react-native run-ios` or `npx react-native run-android`, then
# `maestro test maestro/debug-build.yaml`.
appId: com.hotcodepush.demo.reactnative
---
- launchApp:
    permissions:
      notifications: allow
# The first launch waits for Metro to bundle the JavaScript.
- extendedWaitUntil:
    visible: 'Sync now'
    timeout: 120000
- assertVisible: 'embedded'
- tapOn: 'Sync now'
- extendedWaitUntil:
    notVisible: 'syncing…'
    timeout: 60000
- assertVisible: 'skipped · build_debug'
